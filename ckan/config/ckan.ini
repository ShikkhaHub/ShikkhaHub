# ShikkhaHub CKAN Configuration
# =================================
# Managed by docker-compose environment variables; this file holds the parts
# that are not templated via envvars.
#
# NOTE: The value below are defaults. Most settings are injected by the
# container's environment block (CKAN__... vars) in docker-compose.yml.

[app:main]
use = egg:ckan

ckan.plugins = image_view text_view recline_view scheming_datasets scheming_groups datastore datapusher resource_proxy dcat dcat_rdf_harvester dcat_json_harvester harvest spatial_metadata spatial_query spatial_harvest_metadata_api xloader

# --------------------------------------------------------------------- storage
ckan.storage_path = /var/lib/ckan

# --------------------------------------------------------------- file upload
ckan.max_resource_size = 10
ckan.max_image_size = 2

# ---------------------------------------------------------------- scheming
ckan.scheming.dataset_schemas = /srv/app/scheming/dataset.yaml
ckan.scheming.presets = /srv/app/scheming/presets.json
ckan.scheming.group_schemas = /srv/app/scheming/group.yaml

# ------------------------------------------------------------------- spatial
ckan.spatial.srid = 4326
ckan.spatial.validator.profiles = iso19139ngdc

# ------------------------------------------------------------------- harvest
ckan.harvest.mq.type = redis
ckan.harvest.mq.redis.url = redis://ckan-redis:6379/3

# ------------------------------------------------------------------- datapusher
ckan.datapusher.url = http://ckan-datapusher:8800
ckan.datapusher.formats = csv xls xlsx tsv
ckan.datapusher.callback_url_base = http://ckan:5000

# ------------------------------------------------------------------- xloader
ckan.xloader.redis.url = redis://ckan-redis:6379/2

# ------------------------------------------------------------------- dcat
ckan.dcat.expose_subcatalogs = true

# ------------------------------------------------------------------- search
ckan.solr_url = http://ckan-solr:8983/solr/ckan

# ------------------------------------------------------------------- redis
ckan.redis.url = redis://ckan-redis:6379/1

# ------------------------------------------------------------------- email
smtp.server = localhost:25
smtp.starttls = False
smtp.mail_from = ckan@shikkhahub.com

# ------------------------------------------------------------------- activity
ckan.activity_streams_enabled = true

# ------------------------------------------------------------------- auth
ckan.auth.anon_create_dataset = false
ckan.auth.create_dataset_if_not_in_authorized_group = true
ckan.auth.user_create_groups = true
ckan.auth.user_create_organizations = true
ckan.auth.create_user_via_api = true
ckan.auth.create_user_via_web = true
ckan.auth.public_user_details = true

# ------------------------------------------------------------------- security
ckan.robots_txt = User-agent: *\nAllow: /dataset/\nAllow: /organization/\nAllow: /group/\nDisallow: /

# ------------------------------------------------------------------- error
debug = false

[loggers]
keys = root, ckan, ckanext

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_ckan]
level = INFO
handlers = console
qualname = ckan

[logger_ckanext]
level = INFO
handlers = console
qualname = ckanext

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
